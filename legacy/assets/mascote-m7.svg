<svg width="760" height="980" viewBox="0 0 760 980" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="navy" x1="214" y1="438" x2="584" y2="882" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B376D"/><stop offset="1" stop-color="#031B3D"/>
  </linearGradient>
  <linearGradient id="metal" x1="245" y1="89" x2="511" y2="406" gradientUnits="userSpaceOnUse">
    <stop stop-color="white"/><stop offset=".5" stop-color="#DBE7F1"/><stop offset="1" stop-color="#99AFC5"/>
  </linearGradient>
  <linearGradient id="visor" x1="256" y1="178" x2="532" y2="312" gradientUnits="userSpaceOnUse">
    <stop stop-color="#011126"/><stop offset="1" stop-color="#06294F"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- antenna -->
<path d="M381 86V38" stroke="#DCEBF7" stroke-width="16" stroke-linecap="round"/>
<circle cx="381" cy="28" r="21" fill="#00B9E8" stroke="#EAF9FF" stroke-width="8" filter="url(#glow)"/>

